  <body>

    <div id="app"></div>
    <script>
      if (location.hostname === "127.0.0.1") {

        apiKey: "AIzaSyAYFRoQiPhS8jXTefHcA9PfmbSbT4WNdNw",
        authDomain: "epivida-hevm.firebaseapp.com",
        projectId: "epivida-hevm",
        storageBucket: "epivida-hevm.firebasestorage.app",
        messagingSenderId: "721538111286",
        appId: "1:721538111286:web:d99ecc9fa13874600d4597"
      };
      window.EPIVIDA_DATA_PROVIDER = "google_sheets";
      window.EPIVIDA_FIRESTORE_SYNC = false;
      window.EPIVIDA_SHEETS_CONFIG = {

        printSheetGid: "264683400",

    <script>
      const epividaScripts = ["./epivida-date-guard.js?v=2026-05-08-date01", "./data/censo-data.js"];
      if (location.hostname === "localhost") {
        epividaScripts.push("./data/censo-data.private.js");
      }
      epividaScripts.push("./iaas-system.js?v=2026-05-08-corefix01");
      epividaScripts.push("./iaas-round-nav-toggle-fix.js?v=2026-05-07-iaas-navtoggle06");
      epividaScripts.push("./preventive-round-repair.js?v=2026-05-08-repair02");
      (async () => {
        for (const src of epividaScripts) {
          await new Promise(resolve => {
            const script = document.createElement("script");
            script.src = src;
            script.onload = resolve;
            script.onerror = resolve;
            document.body.append(script);
          });
        }
      })();
    </script>
