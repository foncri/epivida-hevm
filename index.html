<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpiVida HEVM</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #020817;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 90%;
      max-width: 720px;
      padding: 32px;
      border-radius: 24px;
      background: linear-gradient(135deg, #0f172a, #062f35);
      border: 1px solid rgba(45, 212, 191, 0.35);
      box-shadow: 0 0 40px rgba(20, 184, 166, 0.25);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 999px;
      background: #14b8a6;
      color: #021014;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>EpiVida HEVM</h1>
    <p>Censo hospitalario integral de vigilancia epidemiológica.</p>
    <div class="badge">GitHub Pages funcionando</div>
  </main>
</body>
</html>
