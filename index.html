    <script>
      (() => {
        const resetVersion = "2026-05-11-empty-pilot01";
        const resetKey = `epivida-pilot-reset-${resetVersion}`;
        try {
          if (localStorage.getItem(resetKey) !== "done") {
            localStorage.removeItem("epivida-iaas-os-v1");
            localStorage.removeItem("epivida-iaas-drafts-v1");
            localStorage.setItem(resetKey, "done");
          }
        } catch (error) {
          console.warn("No se pudo limpiar el estado local para piloto", error);
        }
      })();
    </script>
    <script>
      const loadedEpividaScripts = new Set();
      const idle = window.requestIdleCallback || (callback => window.setTimeout(callback, 700));
      const epividaCoreScripts = ["./epivida-date-guard.js?v=2026-05-08-date01", "./data/censo-data.js"];
      if (location.hostname === "localhost") {
        epividaCoreScripts.push("./data/censo-data.private.js");
      }
      epividaCoreScripts.push("./iaas-urgencias-aisp-system-preloader-2026-06-01.js?v=2026-06-01-aisp02");
      epividaCoreScripts.push("./iaas-system-grid-resize-preloader-2026-05-22.js?v=2026-05-22-grid01");
      epividaCoreScripts.push("./iaas-system.js?v=2026-06-04-perf01");
      epividaCoreScripts.push("./epivida-interface-stability-hotfix-2026-05-18.js?v=2026-05-18-fix01");

      const epividaRouteBundles = {
        "ronda": [
          "./preventive-bed-prerender-2026-05-12.js?v=2026-06-01-aisp01",
          "./preventive-pe-summary-visibility-2026-06-01.js?v=2026-06-01-pe02",
          "./preventive-packages-enhancement-2026-06-01.js?v=2026-06-01-preventive02",
          "./iaas-round-nav-toggle-fix.js?v=2026-05-07-iaas-navtoggle06",
          "./preventive-native-save-guard-2026-05-12.js?v=2026-05-12-iaassave01",
          "./preventive-round-repair.js?v=2026-05-19-noreload01",
          "./preventive-invasive-editor.js?v=2026-05-19-noreload01",
          "./preventive-hide-cultures.js?v=2026-05-19-noreload01",
          "./preventive-page-behavior-2026-05-12.js?v=2026-05-12-fixedbeds02"
        ],
        "seguimiento-iaas": [
          "./iaas-followup-flow-stabilizer-2026-05-12.js?v=2026-05-13-flow05",
          "./iaas-followup-ownership-2026-05-12.js?v=2026-05-19-noreload01",
          "./iaas-history-range-filter-2026-05-12.js?v=2026-05-12-history01",
          "./epivida-iaas-followup-noreload-hotfix-2026-05-13.js?v=2026-05-13-noreload01",
          "./epivida-iaas-followup-counts-hotfix-2026-05-18.js?v=2026-05-18-fix02"
        ],
        "pacientes": [
          "./iaas-followup-flow-stabilizer-2026-05-12.js?v=2026-05-13-flow05",
          "./iaas-followup-ownership-2026-05-12.js?v=2026-05-19-noreload01",
          "./epivida-iaas-followup-noreload-hotfix-2026-05-13.js?v=2026-05-13-noreload01"
        ],
        "importar-censo": [
          "./import-service-fix.js?v=2026-06-02-legacy-disabled01",
          "./import-urgencias-aisp-fix-2026-06-01.js?v=2026-06-01-aisp01",
          "./import-census-repair.js?v=2026-06-02-legacy-disabled01"
        ],
        "monitoreo-epidemiologico": [
          "./epivida-iaas-monitor-sync-hotfix-2026-05-18.js?v=2026-05-18-fix02",
          "./epivida-monitor-filter-visibility-hotfix-2026-05-18.js?v=2026-05-19-fix02"
        ],
        "reporte-diario": [
          "./iaas-system-cedulas-loader-2026-05-21.js?v=2026-05-21-monthly01"
        ]
      };
      epividaRouteBundles.dashboard = [
        "./contrast-repair.js?v=2026-05-11-contrast11",
        "./epivida-iaas-sheets-preventive-hotfix-2026-05-18.js?v=2026-05-18-fix05"
      ];
      epividaRouteBundles["censo-hospitalario"] = epividaRouteBundles.dashboard;

      const epividaBackgroundScripts = [
        "./iaas-system-cedulas-loader-2026-05-21.js?v=2026-05-21-monthly01",
        "./contrast-repair.js?v=2026-05-11-contrast11",
        "./epivida-iaas-sheets-preventive-hotfix-2026-05-18.js?v=2026-05-18-fix05",
        ...Object.values(epividaRouteBundles).flat()
      ];

      function epividaRouteName() {
        return (location.hash || "#/dashboard").replace(/^#\/?/, "").split(/[/?#]/)[0] || "dashboard";
      }

      function loadEpividaScript(src) {
        if (loadedEpividaScripts.has(src)) return Promise.resolve();
        loadedEpividaScripts.add(src);
        return new Promise(resolve => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = async () => {
            try {
              if (src.includes("iaas-system-cedulas-loader") && window.__epividaCedulasReady) {
                await window.__epividaCedulasReady;
              }
            } catch (error) {
              console.error("No se pudo esperar el cargador de cedulas preventivas.", error);
            }
            resolve();
          };
          script.onerror = resolve;
          document.body.append(script);
        });
      }

      async function loadEpividaScripts(scripts) {
        for (const src of scripts) await loadEpividaScript(src);
      }

      async function loadCurrentRouteBundle() {
        await loadEpividaScripts(epividaRouteBundles[epividaRouteName()] || []);
      }

      (async () => {
        await loadEpividaScripts(epividaCoreScripts);
        await loadCurrentRouteBundle();
        window.addEventListener("hashchange", () => idle(loadCurrentRouteBundle));
        idle(() => loadEpividaScripts(epividaBackgroundScripts));
      })();
    </script>
  </body>
</html>
