name: Fix IAAS round nav toggle click

on:
  push:
    paths:
      - ".github/workflows/fix-iaas-round-nav-toggle-click.yml"

permissions:
  contents: write

jobs:
  fix-toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch IAAS toggle handler
        run: |
          node <<'NODE'
          const fs = require('fs');
          const jsPath = 'iaas-system.js';
          const indexPath = 'index.html';
          let js = fs.readFileSync(jsPath, 'utf8');
          let index = fs.readFileSync(indexPath, 'utf8');

          if (!js.includes('ROUND_NAV_COLLAPSE_KEY')) {
            throw new Error('No se encontro la configuracion del boton de camas IAAS.');
          }
          if (!js.includes('round-nav-toggle')) {
            throw new Error('No se encontro el boton abrir/cerrar de camas IAAS.');
          }

          const helperPattern = /function setRoundNavCollapsed\(mode, collapsed\) \{[\s\S]*?\n  \}/;
          const match = js.match(helperPattern);
          if (!match) {
            throw new Error('No se encontro setRoundNavCollapsed.');
          }

          const previousHelper = match[0];
          const nextHelper = `function setRoundNavCollapsed(mode, collapsed) {
    try {
      sessionStorage.setItem(roundNavStorageKey(mode), collapsed ? "1" : "0");
    } catch (error) {
      // El estado colapsado es auxiliar; si el navegador lo bloquea, la ronda sigue funcionando.
    }
    const board = document.querySelector(".round-nav-board");
    if (board) {
      board.classList.toggle("collapsed", Boolean(collapsed));
      const toggle = board.querySelector(".round-nav-toggle");
      if (toggle) {
        toggle.textContent = collapsed ? "Mostrar camas" : "Ocultar camas";
        toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      }
    }
    renderIaas();
  }`;

          js = js.replace(helperPattern, nextHelper);
          if (js.includes('\n    render();\n') && nextHelper !== previousHelper) {
            throw new Error('La llamada incorrecta render() sigue presente.');
          }
          if (!js.includes('renderIaas();')) {
            throw new Error('No quedo conectada la actualizacion correcta renderIaas().');
          }

          index = index.replaceAll('iaas-navtoggle02', 'iaas-navtoggle03');
          if (!index.includes('iaas-navtoggle03')) {
            throw new Error('No se actualizo la version de cache del navegador.');
          }

          fs.writeFileSync(jsPath, js);
          fs.writeFileSync(indexPath, index);
          NODE
          node --check iaas-system.js

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-iaas-round-nav-toggle-click.yml
          git add iaas-system.js index.html
          git commit -m "Fix IAAS bed selector toggle"
          git push origin HEAD:main
