name: Apply IAAS round navigation toggle v2

on:
  push:
    paths:
      - '.github/workflows/apply-iaas-round-nav-toggle-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply collapsible bed selector
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cacheVersion = '2026-05-07-iaas-navtoggle02';
          const workflowPaths = [
            '.github/workflows/apply-iaas-round-nav-toggle.yml',
            '.github/workflows/apply-iaas-round-nav-toggle-v2.yml'
          ];
          const jsPath = 'iaas-system.js';
          const cssPath = 'iaas-system.css';
          const htmlPath = 'index.html';
          let js = fs.readFileSync(jsPath, 'utf8');
          let css = fs.readFileSync(cssPath, 'utf8');
          let html = fs.readFileSync(htmlPath, 'utf8');

          function assertChanged(before, after, label) {
            if (before === after) throw new Error('No se pudo aplicar el cambio esperado en ' + label + '.');
          }

          const originalJs = js;
          if (!js.includes('ROUND_NAV_COLLAPSE_KEY')) {
            const anchor = '  const DRAFT_KEY = "epivida-iaas-drafts-v1";';
            if (!js.includes(anchor)) throw new Error('No se encontro DRAFT_KEY para insertar ROUND_NAV_COLLAPSE_KEY.');
            js = js.replace(anchor, anchor + '\n  const ROUND_NAV_COLLAPSE_KEY = "epivida-round-nav-collapsed-v1";');
          }

          if (!js.includes('function roundNavCollapsed(')) {
            const helpers = '\n\n'
              + '  function roundNavStorageKey(mode) {\n'
              + '    return ROUND_NAV_COLLAPSE_KEY + "-" + (mode || "default");\n'
              + '  }\n\n'
              + '  function roundNavCollapsed(mode) {\n'
              + '    try {\n'
              + '      return sessionStorage.getItem(roundNavStorageKey(mode)) === "1";\n'
              + '    } catch (error) {\n'
              + '      return false;\n'
              + '    }\n'
              + '  }\n\n'
              + '  function setRoundNavCollapsed(mode, collapsed) {\n'
              + '    try {\n'
              + '      sessionStorage.setItem(roundNavStorageKey(mode), collapsed ? "1" : "0");\n'
              + '    } catch (error) {\n'
              + '      // La preferencia de vista no es critica si el navegador bloquea sessionStorage.\n'
              + '    }\n'
              + '    render();\n'
              + '  }\n\n'
              + '  function roundNavToggleLabel(mode, collapsed) {\n'
              + '    const label = mode === "iaas" ? "camas IAAS" : "camas";\n'
              + '    return (collapsed ? "Mostrar " : "Ocultar ") + label;\n'
              + '  }\n';
            const renderAnchor = /\n  function renderPatientRound\(/;
            if (!renderAnchor.test(js)) throw new Error('No se encontro renderPatientRound para insertar helpers.');
            js = js.replace(renderAnchor, helpers + '\n  function renderPatientRound(');
          }

          if (!js.includes('round-nav-toggle')) {
            const returnPattern = /(\s*)return h\("div", \{ class: `round-nav-board \$\{([^}]+)\}` \}, \[/;
            const match = js.match(returnPattern);
            if (!match) {
              const idx = js.indexOf('round-nav-board');
              throw new Error('No se encontro el contenedor round-nav-board. Contexto: ' + js.slice(Math.max(0, idx - 500), idx + 500));
            }
            const indent = match[1];
            const modeExpression = match[2].trim();
            const replacement = indent + 'const roundNavMode = ' + modeExpression + ';\n'
              + indent + 'const collapsed = roundNavCollapsed(roundNavMode);\n'
              + indent + 'return h("div", { class: "round-nav-board " + roundNavMode + (collapsed ? " collapsed" : "") }, [';
            js = js.replace(returnPattern, replacement);

            const headerSpan = 'h("span", {}, ["Seleccionar cama"])';
            if (!js.includes(headerSpan)) throw new Error('No se encontro el texto Seleccionar cama en el encabezado del selector.');
            const toggleMarkup = 'h("div", { class: "round-nav-actions" }, [\n'
              + '        h("span", {}, ["Seleccionar cama"]),\n'
              + '        h("button", {\n'
              + '          type: "button",\n'
              + '          class: "round-nav-toggle",\n'
              + '          "aria-expanded": String(!collapsed),\n'
              + '          onclick: event => {\n'
              + '            event.preventDefault();\n'
              + '            setRoundNavCollapsed(roundNavMode, !collapsed);\n'
              + '          }\n'
              + '        }, [roundNavToggleLabel(roundNavMode, collapsed)])\n'
              + '      ])';
            js = js.replace(headerSpan, toggleMarkup);
          }
          assertChanged(originalJs, js, jsPath);
          fs.writeFileSync(jsPath, js);

          const originalCss = css;
          if (!css.includes('.round-nav-actions')) {
            const cssAnchor = '.round-nav-head span {\n  color: #64748b;\n  font-weight: 800;\n}\n';
            if (!css.includes(cssAnchor)) throw new Error('No se encontro .round-nav-head span para insertar estilos del toggle.');
            css = css.replace(cssAnchor, cssAnchor + '\n'
              + '.round-nav-actions {\n'
              + '  display: flex;\n'
              + '  align-items: center;\n'
              + '  justify-content: flex-end;\n'
              + '  gap: 8px;\n'
              + '  flex-wrap: wrap;\n'
              + '}\n\n'
              + '.round-nav-toggle {\n'
              + '  min-height: 30px;\n'
              + '  border: 1px solid rgba(96, 120, 170, .28);\n'
              + '  border-radius: 999px;\n'
              + '  padding: 6px 11px;\n'
              + '  color: #0c193d;\n'
              + '  background: #fff;\n'
              + '  cursor: pointer;\n'
              + '  font-size: 11px;\n'
              + '  font-weight: 950;\n'
              + '}\n\n'
              + '.round-nav-toggle:hover,\n'
              + '.round-nav-toggle:focus-visible {\n'
              + '  border-color: rgba(36, 87, 214, .46);\n'
              + '  background: #eef4ff;\n'
              + '}\n\n'
              + '.round-nav-board.collapsed {\n'
              + '  gap: 0;\n'
              + '  padding-block: 8px;\n'
              + '}\n\n'
              + '.round-nav-board.collapsed .round-nav-grid {\n'
              + '  display: none;\n'
              + '}\n');
          }
          if (!css.includes('.command-shell .round-nav-board.collapsed')) {
            css += '\n.command-shell .round-nav-board.collapsed {\n'
              + '  min-height: 48px;\n'
              + '}\n\n'
              + '.command-shell .round-nav-toggle {\n'
              + '  color: #0b1848 !important;\n'
              + '  border-color: rgba(96,120,170,.38) !important;\n'
              + '  background: linear-gradient(135deg, #ffffff, #eef4ff) !important;\n'
              + '}\n\n'
              + '@media screen and (max-width: 760px) {\n'
              + '  .command-shell .round-nav-actions {\n'
              + '    justify-content: space-between !important;\n'
              + '  }\n\n'
              + '  .command-shell .round-nav-toggle {\n'
              + '    min-height: 34px !important;\n'
              + '    width: auto !important;\n'
              + '    padding: 7px 10px !important;\n'
              + '    font-size: 11px !important;\n'
              + '  }\n'
              + '}\n';
          }
          assertChanged(originalCss, css, cssPath);
          fs.writeFileSync(cssPath, css);

          const originalHtml = html;
          html = html.replace(/iaas-system\.css\?v=[^"']+/g, 'iaas-system.css?v=' + cacheVersion);
          html = html.replace(/iaas-system\.js\?v=[^"']+/g, 'iaas-system.js?v=' + cacheVersion);
          assertChanged(originalHtml, html, htmlPath);
          fs.writeFileSync(htmlPath, html);

          if (!js.includes('ROUND_NAV_COLLAPSE_KEY') || !js.includes('round-nav-toggle') || !css.includes('.round-nav-board.collapsed') || !html.includes(cacheVersion)) {
            throw new Error('Verificacion final incompleta del toggle de camas.');
          }

          for (const workflowPath of workflowPaths) {
            fs.rmSync(workflowPath, { force: true });
          }
          NODE
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iaas-system.js iaas-system.css index.html .github/workflows/apply-iaas-round-nav-toggle.yml .github/workflows/apply-iaas-round-nav-toggle-v2.yml
          git commit -m "Add collapsible IAAS bed selector" || exit 0
          git push
