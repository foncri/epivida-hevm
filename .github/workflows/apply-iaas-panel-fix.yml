name: Apply IAAS panel scroll fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Fix IAAS patient summary scroll behavior') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch IAAS panel behavior
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          css = Path('iaas-system.css')
          text = css.read_text(encoding='utf-8')
          pattern = r'(\.patient-sticky-summary\s*\{\n)\s*position:\s*sticky;\n\s*top:\s*72px;\n\s*z-index:\s*15;\n'
          replacement = r'\1  position: static;\n'
          next_text, count = re.subn(pattern, replacement, text, count=1)
          if count == 0:
            if 'patient-sticky-summary {\n  position: static;' not in text:
              raise SystemExit('No se encontro la regla sticky de patient-sticky-summary')
            next_text = text
          css.write_text(next_text, encoding='utf-8')

          html = Path('index.html')
          page = html.read_text(encoding='utf-8')
          page = re.sub(r'iaas-system\.css\?v=[^"\']+', 'iaas-system.css?v=2026-05-07-iaas-panel02', page)
          page = re.sub(r'iaas-system\.js\?v=[^"\']+', 'iaas-system.js?v=2026-05-07-iaas-panel02', page)
          html.write_text(page, encoding='utf-8')

          Path('.github/workflows/apply-iaas-panel-fix.yml').unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add -A
          git status --short
          git commit -m "Fix IAAS patient summary scroll behavior"
          git push origin HEAD:main
