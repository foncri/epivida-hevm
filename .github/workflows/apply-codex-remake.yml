name: Apply Codex remake patch

on:
  push:
    branches:
      - "codex/remake-paquetes-preventivos"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Codex remake patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remake-paquetes-preventivos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch payload
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const payloadB64 = fs.readFileSync('.codex-upload/remake-paquetes.patch.gz.b64', 'utf8').replace(/\s+/g, '');
          const payload = JSON.parse(zlib.gunzipSync(Buffer.from(payloadB64, 'base64')).toString('utf8'));
          for (const patch of payload.patches) {
            const original = fs.readFileSync(patch.path, 'utf8');
            const baseSha = crypto.createHash('sha256').update(original).digest('hex');
            if (baseSha !== patch.baseSha256) throw new Error(`${patch.path} base mismatch ${baseSha}`);
            const lines = original.split(/(?<=\n)/);
            for (const hunk of [...patch.hunks].sort((a, b) => b.start - a.start)) {
              lines.splice(hunk.start, hunk.deleteCount, ...hunk.insert);
            }
            const next = lines.join('');
            const nextSha = crypto.createHash('sha256').update(next).digest('hex');
            if (nextSha !== patch.localSha256) throw new Error(`${patch.path} result mismatch ${nextSha}`);
            fs.writeFileSync(patch.path, next, 'utf8');
          }
          fs.rmSync('.codex-upload', { recursive: true, force: true });
          fs.rmSync('.github/workflows/apply-codex-remake.yml', { force: true });
          NODE
      - name: Commit final files
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add -A
          git status --short
          git commit -m "Remake preventive packages workflow"
          git push origin HEAD:codex/remake-paquetes-preventivos
