name: EPIVIDA Lite validation

on:
  push:
    branches:
      - feature/epivida-lite-ultrafast-rework
    paths:
      - "lite/**"
      - "firebase.json"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/epivida-lite-validate.yml"
  pull_request:
    paths:
      - "lite/**"
      - "firebase.json"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/epivida-lite-validate.yml"
  workflow_dispatch:

jobs:
  validate-lite:
    name: Validate EPIVIDA Lite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Lite preflight
        env:
          EPIVIDA_STRICT_SYNTAX: "1"
        run: node lite/tools/validate-all.mjs
